name: Validate Pokédex

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check pokedex/script.js
          node --check pokedex/guide.js
          node --check pokedex/enhancements.js
          node --check pokedex/i18n.js
          node --check pokedex/tabs.js
          node --check pokedex/search.js
          node --check pokedex/catalog.js
          node --check pokedex/ability-names.js
      - name: Run guide logic tests
        run: node --test tests/*.test.cjs
      - name: Check opening experience
        run: |
          grep -q 'id="intro-overlay"' pokedex/index.html
          grep -q 'intro-open-top' pokedex/style.css
          ! grep -q 'CENTRAL DE EXPLORAÇÃO' pokedex/index.html
      - name: Verify second-screen organization and language switch
        run: |
          grep -q 'data-language="pt"' pokedex/index.html
          grep -q 'data-language="en"' pokedex/index.html
          grep -q 'id="panel-evolution"' pokedex/index.html
          grep -q 'id="guide-encounters"' pokedex/index.html
          grep -q 'id="panel-favorites"' pokedex/index.html
          ! grep -q 'class="battle-guide"' pokedex/index.html
      - name: Check generation and suggestion UI
        run: |
          grep -q 'id="game-filter"' pokedex/index.html
          grep -q 'id="suggestion-list"' pokedex/index.html
          grep -q 'ability-names.js?v=4' pokedex/index.html
          grep -q 'search.js?v=5' pokedex/index.html
      - name: Verify game-based filter is not numeric-generation-based
        run: |
          grep -q 'version-group/' pokedex/search.js
          grep -q 'pokedex/' pokedex/search.js
          ! grep -q 'rangeFor(ui.generation' pokedex/script.js
      - name: Check entrypoint files
        run: |
          test -s index.html
          test -s pokedex/index.html
          test -s pokedex/style.css
          test -s pokedex/guide.js
          test -s pokedex/enhancements.js
          test -s pokedex/i18n.js
          test -s pokedex/tabs.js
          test -s pokedex/search.js
          test -s pokedex/catalog.js
          test -s pokedex/ability-names.js
