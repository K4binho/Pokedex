name: Validate Pokédex

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check pokedex/script.js
      - name: Check entrypoint files
        run: |
          test -s index.html
          test -s pokedex/index.html
          test -s pokedex/style.css
